services:
  db:
    image: pgvector/pgvector:pg17
    container_name: karaguruka-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: karaguruka
      POSTGRES_DB: karaguruka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - karaguruka-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karaguruka -d karaguruka"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  karaguruka-pgdata:
